name: Build LOCKORA APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug & Release APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Accept SDK licenses
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      # 5. Install required SDK components
      - name: Install SDK components
        run: |
          sdkmanager "platforms;android-35" \
                     "build-tools;35.0.0" \
                     "platform-tools"

      # 6. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # 7. Make gradlew executable
      - name: Make gradlew executable
        run: chmod +x ./gradlew || true

      # 8. Run unit tests
      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      # 9. Build Debug APK
      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      # 10. Decode keystore (only if secret exists)
      - name: Decode keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/release.keystore
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV

      # 11. Build Release APK
      - name: Build Release APK
        run: gradle assembleRelease --stacktrace

      # 12. Prepare artifacts folder
      - name: Prepare artifact directory
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/*.apk artifacts/ 2>/dev/null || true
          cp app/build/outputs/apk/release/*.apk artifacts/ 2>/dev/null || true
          ls -la artifacts

      # 13. Upload LOCKORA-APK artifact
      - name: Upload LOCKORA-APK
        uses: actions/upload-artifact@v4
        with:
          name: LOCKORA-APK
          path: artifacts/*.apk
          if-no-files-found: warn
